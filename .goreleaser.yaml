# GoReleaser config - builds Linux binaries, .deb and .rpm packages, and
# uploads them to the GitHub Release. See .github/workflows/release.yml.
version: 2

project_name: ptop

before:
  hooks:
    - go mod tidy

builds:
  - id: ptop
    main: .
    binary: ptop
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: targz
    ids:
      - ptop
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md

nfpms:
  - id: packages
    ids:
      - ptop
    package_name: ptop
    vendor: alun-hub
    homepage: https://github.com/alun-hub/ptop
    maintainer: alun-hub <andreas.lundqvist@gmail.com>
    description: |-
      Guided performance measurement for Linux servers.
      A btop-style terminal UI for disk, CPU, memory, network and GPU
      benchmarks, with plain-language interpretation and run-to-run history.
    section: utils
    priority: optional
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - src: README.md
        dst: /usr/share/doc/ptop/README.md
    # Optional tools ptop uses when present (falls back to built-ins otherwise).
    recommends:
      - fio
      - sysbench
      - iperf3

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: alun-hub
    name: ptop
  # The release is created by a human; keep their notes and just add the
  # build artifacts.
  mode: keep-existing
  replace_existing_artifacts: true
